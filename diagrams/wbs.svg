  <rect class="task" x="650" y="366" width="190" height="32"/><text class="tt" x="745" y="387">Date + Calendar export</text>
  <rect class="task" x="650" y="408" width="190" height="32"/><text class="tt" x="745" y="429">Realtime sync</text>
