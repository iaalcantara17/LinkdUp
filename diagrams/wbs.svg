<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C3EF4"/><stop offset="1" stop-color="#00C2FF"/></linearGradient>
    <style>
      .root{fill:url(#g);rx:12}
      .phase{fill:#15151F;stroke:#6C3EF4;stroke-width:2;rx:10}
      .task{fill:#1F1F2E;stroke:#00C2FF;stroke-width:1;rx:6}
      .lt{fill:white;font-size:13px;font-weight:700;text-anchor:middle}
      .tt{fill:#E5E7EB;font-size:11px;text-anchor:middle}
      .line{stroke:#6C3EF4;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#0B0B14"/>
  <text x="550" y="32" text-anchor="middle" fill="white" font-size="22" font-weight="800">LinkdUp — Work Breakdown Structure</text>

  <rect class="root" x="450" y="60" width="200" height="50"/>
  <text class="lt" x="550" y="92">LinkdUp Capstone</text>

