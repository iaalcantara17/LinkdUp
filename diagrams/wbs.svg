  <rect class="phase" x="440" y="160" width="190" height="50"/><text class="lt" x="535" y="190">3. Design</text>
  <rect class="phase" x="650" y="160" width="190" height="50"/><text class="lt" x="745" y="190">4. Develop</text>
  <rect class="phase" x="860" y="160" width="220" height="50"/><text class="lt" x="970" y="190">5. Evaluate</text>

