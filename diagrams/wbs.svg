  <rect class="task" x="860" y="408" width="220" height="32"/><text class="tt" x="970" y="429">Final presentation</text>

  <path class="line" d="M 550 110 L 115 160 M 550 110 L 325 160 M 550 110 L 535 160 M 550 110 L 745 160 M 550 110 L 970 160"/>
