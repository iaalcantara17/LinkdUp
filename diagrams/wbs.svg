  <rect class="task" x="20" y="282" width="190" height="32"/><text class="tt" x="115" y="303">GitHub + Kanban</text>
  <rect class="task" x="20" y="324" width="190" height="32"/><text class="tt" x="115" y="345">Risk register</text>
  <rect class="task" x="20" y="366" width="190" height="32"/><text class="tt" x="115" y="387">Weekly standups</text>

  <rect class="task" x="230" y="240" width="190" height="32"/><text class="tt" x="325" y="261">Stakeholder panel</text>
  <rect class="task" x="230" y="282" width="190" height="32"/><text class="tt" x="325" y="303">Scope v2 lock</text>
  <rect class="task" x="230" y="324" width="190" height="32"/><text class="tt" x="325" y="345">FDD</text>
  <rect class="task" x="230" y="366" width="190" height="32"/><text class="tt" x="325" y="387">Phase 2 cuts</text>

  <rect class="task" x="440" y="240" width="190" height="32"/><text class="tt" x="535" y="261">User flow</text>
  <rect class="task" x="440" y="282" width="190" height="32"/><text class="tt" x="535" y="303">Figma mockups</text>
  <rect class="task" x="440" y="324" width="190" height="32"/><text class="tt" x="535" y="345">System architecture</text>
  <rect class="task" x="440" y="366" width="190" height="32"/><text class="tt" x="535" y="387">DB ERD (8 tables)</text>

