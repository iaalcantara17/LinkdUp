<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C3EF4"/><stop offset="1" stop-color="#00C2FF"/></linearGradient>
    <style>
      .box{fill:#15151F;stroke:url(#g);stroke-width:2;rx:14}
      .lbl{fill:white;font-size:14px;font-weight:700}
      .sub{fill:#A1A1AA;font-size:11px}
      .arrow{stroke:#6C3EF4;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6C3EF4"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#0B0B14"/>
  <text x="500" y="36" text-anchor="middle" fill="white" font-size="22" font-weight="800">LinkdUp — System Architecture</text>

  <rect class="box" x="380" y="80" width="240" height="100" rx="14"/>
  <text class="lbl" x="500" y="115" text-anchor="middle">Expo Mobile App</text>
  <text class="sub" x="500" y="135" text-anchor="middle">React Native + TypeScript</text>
  <text class="sub" x="500" y="152" text-anchor="middle">Navigation • Auth Context • Theme</text>

  <rect class="box" x="380" y="240" width="240" height="100" rx="14"/>
  <text class="lbl" x="500" y="275" text-anchor="middle">Express API (Railway)</text>
  <text class="sub" x="500" y="295" text-anchor="middle">Node + TypeScript</text>
  <text class="sub" x="500" y="312" text-anchor="middle">Routes • Services • Match Engine</text>

  <rect class="box" x="80" y="400" width="240" height="120" rx="14"/>
  <text class="lbl" x="200" y="435" text-anchor="middle">Supabase</text>
  <text class="sub" x="200" y="455" text-anchor="middle">Postgres • Auth • Realtime</text>
  <text class="sub" x="200" y="472" text-anchor="middle">8 tables, RLS policies</text>
  <text class="sub" x="200" y="495" text-anchor="middle">Vote sync via row replication</text>

  <rect class="box" x="680" y="400" width="240" height="120" rx="14"/>
  <text class="lbl" x="800" y="435" text-anchor="middle">Google Cloud</text>
  <text class="sub" x="800" y="455" text-anchor="middle">Places API (New)</text>
  <text class="sub" x="800" y="472" text-anchor="middle">Geocoding API</text>
  <text class="sub" x="800" y="495" text-anchor="middle">Calendar API v3 (OAuth)</text>

  <path class="arrow" d="M 500 180 L 500 240"/>
  <path class="arrow" d="M 500 340 L 220 400"/>
  <path class="arrow" d="M 500 340 L 780 400"/>
  <path class="arrow" d="M 380 130 Q 200 200 200 400" stroke-dasharray="6 4"/>
  <text fill="#A1A1AA" font-size="11" x="220" y="220">realtime subscribe</text>
</svg>
