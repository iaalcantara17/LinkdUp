name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test with coverage
        shell: bash
        run: |
          npm run test:coverage 2>&1 | tee test-output.txt
          {
            echo '### Server test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed -E 's/^(# |ℹ )//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - name: Test with coverage
        shell: bash
        run: |
          npm run test:coverage 2>&1 | tee test-output.txt
          {
            echo '### Mobile logic test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed -E 's/^(# |ℹ )//'
            echo '```'
            echo '### Mobile screen test coverage'
            echo '```'
            sed -n '/Coverage summary/,/^=\{10,\}$/p' test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build:web
